<!doctype html>
<html lang="en">
	<head>
		<!-- Core -->
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark light" />
		<meta name="theme-color" content="#050505" />
		<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
		<meta name="author" content="Steve Osoro Tom" />
		<meta name="publisher" content="Steve Osoro Tom" />
		<meta name="referrer" content="strict-origin-when-cross-origin" />
		<meta name="format-detection" content="telephone=no" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />

		<!-- Geo -->
		<meta name="geo.region" content="KE" />
		<meta name="geo.placename" content="Kenya" />

		<!-- Open Graph / Twitter defaults (per-page values come from <Seo>) -->
		<meta property="og:site_name" content="kenTom" />
		<meta property="og:locale" content="en_KE" />
		<meta name="twitter:card" content="summary_large_image" />

		<!-- Icons & PWA -->
		<link rel="icon" type="image/jpeg" href="%sveltekit.assets%/favicon.jpg" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/favicon.jpg" />
		<meta name="apple-mobile-web-app-title" content="kenTom" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="application-name" content="kenTom" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />

		<!-- Performance hints -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<!-- Typography -->
		<link
			href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Google+Sans+Display:wght@400;500;700&family=Google+Sans+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>

		<!-- Theme boot: set [data-theme] before paint to avoid a flash -->
		<script>
			(function () {
				try {
					var t = localStorage.getItem('kentom-theme');
					document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
				} catch (e) {
					document.documentElement.setAttribute('data-theme', 'dark');
				}
			})();
		</script>

		<!-- Structured Data: Person -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "Person",
			"@id": "https://kentom.co.ke/#person",
			"name": "Steve Osoro Tom",
			"alternateName": ["kenTom", "Raccoon254"],
			"jobTitle": "Full-Stack Developer & Software Engineer",
			"description": "Full-stack developer in Kenya building web apps, mobile apps, and custom software.",
			"url": "https://kentom.co.ke",
			"image": "https://kentom.co.ke/steve-osoro-tom-full-image.png",
			"email": "me@kentom.co.ke",
			"telephone": "+254758481320",
			"address": { "@type": "PostalAddress", "addressCountry": "KE" },
			"sameAs": [
				"https://github.com/Raccoon254",
				"https://www.linkedin.com/in/steve-tom-822a81230/",
				"https://www.tiktok.com/@raccoon.254",
				"https://www.youtube.com/@iamkentom"
			],
			"alumniOf": { "@type": "CollegeOrUniversity", "name": "Chuka University" },
			"knowsLanguage": ["en"],
			"knowsAbout": [
				"JavaScript", "TypeScript", "React", "Next.js", "Svelte", "SvelteKit",
				"Laravel", "PHP", "Kotlin", "Python", "Node.js", "Android Development",
				"Web Development", "Software Engineering", "Full-Stack Development", "API Design"
			],
			"owns": [
				{ "@type": "WebSite", "name": "Axene.io", "url": "https://axene.io" },
				{ "@type": "WebSite", "name": "Chiromo Forge", "url": "https://chiromo.tech" },
				{ "@type": "WebSite", "name": "Qailly", "url": "https://qailly.com" },
				{ "@type": "WebSite", "name": "Pixen", "url": "https://pixen.cc" }
			]
		}
		</script>

		<!-- Structured Data: WebSite -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "WebSite",
			"@id": "https://kentom.co.ke/#website",
			"name": "kenTom",
			"url": "https://kentom.co.ke",
			"description": "Portfolio of Steve Tom (kenTom), a full-stack developer in Kenya. Selected work, notes, and a lab of interface experiments.",
			"inLanguage": "en",
			"publisher": { "@id": "https://kentom.co.ke/#person" }
		}
		</script>

		<!-- Structured Data: Professional service -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "ProfessionalService",
			"@id": "https://kentom.co.ke/#service",
			"name": "kenTom · Development Services",
			"description": "Web apps, mobile apps, and custom software development by Steve Tom.",
			"url": "https://kentom.co.ke/quote",
			"image": "https://kentom.co.ke/kentom_website_banner.jpg",
			"provider": { "@id": "https://kentom.co.ke/#person" },
			"areaServed": { "@type": "Country", "name": "Kenya" },
			"availableLanguage": ["en"],
			"serviceType": [
				"Web Application Development",
				"Mobile App Development",
				"Full-Stack Development",
				"Custom Software",
				"API Development",
				"Software Engineering"
			]
		}
		</script>

		<!-- Structured Data: Site navigation (drives Google sitelinks) -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "SiteNavigationElement",
			"@id": "https://kentom.co.ke/#navigation",
			"name": "Main Navigation",
			"hasPart": [
				{ "@type": "SiteNavigationElement", "name": "Home", "url": "https://kentom.co.ke/", "description": "kenTom · Steve Tom, full-stack developer in Kenya" },
				{ "@type": "SiteNavigationElement", "name": "Notes", "url": "https://kentom.co.ke/blog", "description": "Field notes on building software and products" },
				{ "@type": "SiteNavigationElement", "name": "Lab", "url": "https://kentom.co.ke/lab", "description": "Interface experiments and animation studies, explained" },
				{ "@type": "SiteNavigationElement", "name": "Partners", "url": "https://kentom.co.ke/partners", "description": "Sponsor the work, tiers and how to partner" },
				{ "@type": "SiteNavigationElement", "name": "Quote", "url": "https://kentom.co.ke/quote", "description": "Tell Steve Tom what you are building" },
				{ "@type": "SiteNavigationElement", "name": "Contact", "url": "https://kentom.co.ke/contact", "description": "Start a conversation with Steve Tom" }
			]
		}
		</script>

		<!-- Google AdSense -->
		<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2639581020397408" crossorigin="anonymous"></script>

		<!-- Axene -->
		<script defer src="https://res.axene.io/v/7762lil1.js"></script>

		<!-- Taifa Support -->
		<script
			async
			src="https://taifasupport.rcfi.co.ke/widget.js"
			data-site="ts_RTJW-qyxYBeD97NlI8Uh4x74"
		></script>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
